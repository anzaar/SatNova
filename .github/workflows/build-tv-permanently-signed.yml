name: SatNova TV - Permanent Signature (VERIFIED)
on:
  workflow_dispatch:
  # One-off builder trigger for the owner-requested signed update.
  # Restricted to changes to this workflow on the verified feature branch.
  push:
    branches: [feature/tvbridge-home-override-optin-20261119]
    paths:
      - .github/workflows/build-tv-permanently-signed.yml
permissions:
  contents: write
jobs:
  permanently-signed:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare permanent signing key from repository secrets
        shell: bash
        env:
          SATNOVA_KEYSTORE_B64: ${{ secrets.SATNOVA_KEYSTORE_B64 }}
          SATNOVA_STORE_PASSWORD: ${{ secrets.SATNOVA_STORE_PASSWORD }}
          SATNOVA_KEY_ALIAS: ${{ secrets.SATNOVA_KEY_ALIAS }}
          SATNOVA_KEY_PASSWORD: ${{ secrets.SATNOVA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in SATNOVA_KEYSTORE_B64 SATNOVA_STORE_PASSWORD SATNOVA_KEY_ALIAS SATNOVA_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required signing secret: $name"
              exit 1
            fi
          done
          KEYSTORE="$RUNNER_TEMP/satnova-permanent.jks"
          printf '%s' "$SATNOVA_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          echo "SATNOVA_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "SATNOVA_STORE_PASSWORD=$SATNOVA_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SATNOVA_KEY_ALIAS=$SATNOVA_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SATNOVA_KEY_PASSWORD=$SATNOVA_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDK_MANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile permanent-signature TV launcher
        shell: bash
        run: |
          set -euo pipefail
          test -s tvhome/src/main/assets/satnova_sport_theme.webp || {
            echo "::error::Sports photo must be vendored before creating the signed build"
            exit 1
          }
          gradle --no-daemon --stacktrace :tvhome:assembleTvbridgeRelease
      - name: Confirm signed APK and fingerprint
        shell: bash
        # Public certificate fingerprint is pinned here; no fifth secret needed.
        # The private signing key still comes only from encrypted Actions secrets.
        env:
          SATNOVA_EXPECTED_CERT_SHA256: 53b4392af8e4940c21ac0cb080bbc2bb145d68bd027e96ec3d16557e7799f581
        run: |
          set -euo pipefail
          APK=tvhome/build/outputs/apk/tvbridge/release/tvhome-tvbridge-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/signer.txt
          ACTUAL="$(sed -nE 's/.*Signer #1 certificate SHA-256 digest: ([a-f0-9]{64}).*/\1/p' /tmp/signer.txt | head -n 1)"
          test -n "$ACTUAL"
          echo "Certificate SHA-256: $ACTUAL"
          if [[ "$ACTUAL" != "$SATNOVA_EXPECTED_CERT_SHA256" ]]; then
            echo "::error::Certificate mismatch: refusing to release a different signature."
            exit 1
          fi
          sha256sum "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 5
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" |
            grep -Fq "package: name='com.satnova.tvhome.tvbridge' versionCode='21'"
      - name: Upload securely signed APK for review
        uses: actions/upload-artifact@v4
        with:
          name: SatNova-TV-Home-HDMI-Bridge-0.5.15-PERMANENT-SIGNATURE
          path: tvhome/build/outputs/apk/tvbridge/release/tvhome-tvbridge-release.apk
          retention-days: 30

      - name: Publish permanently signed update APK
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="v0.5.15-tvbridge-permanent-update-20261119-test"
          OUT="SatNova-TV-Home-HDMI-Bridge-0.5.15-PERMANENT-UPDATE.apk"
          cp tvhome/build/outputs/apk/tvbridge/release/tvhome-tvbridge-release.apk "$OUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release already exists; never silently overwrite signed APK"
            exit 1
          fi
          gh release create "$TAG" "$OUT" --target "$GITHUB_SHA" --prerelease \
            --title "SatNova TV Home v0.5.15 - Permanent Signature Update" \
            --notes "SIGNED RELEASE TEST. Verified SHA-256 certificate matches the known public SatNova signing certificate (pinned in workflow). Package com.satnova.tvhome.tvbridge, versionCode 21. Intended to update an installed TVBridge APK ONLY if its signing certificate is the same permanent certificate. Never uninstall existing launcher until app data and factory HOME recovery are safe. Features: automatic receiver-first setup, HDMI remote checks and opt-in boot-to-SatNova."
