name: AltaPlay Launcher Secreto v1.3.2 Direct Mod PRIVATE TEST
on:
  push:
    branches: [feature/altaplay-secreto-direct-mod-v132-20261119]
    paths:
      - scripts/build_altaplay_secreto_mod.py
      - .github/workflows/build-altaplay-secreto-direct-mod.yml
      - tvhome/src/main/java/com/satnova/alpha/Zen4HdmiRemoteService.kt
      - tvhome/src/main/java/com/satnova/alpha/SecretoZenPanel.kt
      - tvhome/src/main/java/com/satnova/alpha/AltaPlayZenActivity.kt
      - tvhome/src/main/java/com/satnova/alpha/Zen4PersistentService.kt
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="$ANDROID_HOME"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDK_MANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile Zen bridge for standalone DEX injection
        run: gradle --no-daemon --stacktrace :tvhome:assembleTvbridgeDebug
      - name: Download verified official Secreto APK and pinned Apktool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-secreto
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/mohamedlalah/SecretoTVLauncher/releases/download/v1.3.2/SecretoTVLauncher-v1.3.2-vc10.apk" \
            -o build-secreto/secreto-official-v132.apk
          echo "ddadbda59ca902ec2895b228d4b680197418114be088db7b0ba56abb83e3a73c  build-secreto/secreto-official-v132.apk" | sha256sum -c -
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/iBotPeaches/Apktool/releases/download/v2.12.1/apktool_2.12.1.jar" \
            -o build-secreto/apktool.jar
          echo "66cf4524a4a45a7f56567d08b2c9b6ec237bcdd78cee69fd4a59c8a0243aeafa  build-secreto/apktool.jar" | sha256sum -c -
      - name: Decode full Secreto UI and resources
        shell: bash
        run: |
          set -euo pipefail
          java -jar build-secreto/apktool.jar d -f \
            build-secreto/secreto-official-v132.apk -o build-secreto/decoded
          test -s build-secreto/decoded/AndroidManifest.xml
          test -d build-secreto/decoded/smali
      - name: Change only app identity, add Zen service and Islamic wallpaper
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_altaplay_secreto_mod.py patch build-secreto/decoded .
          grep -Fq 'com.altaplay.launcher' build-secreto/decoded/AndroidManifest.xml
          grep -Fq 'com.satnova.alpha.Zen4HdmiRemoteService' build-secreto/decoded/AndroidManifest.xml
      - name: Rebuild Secreto with original smali and preserved feature resources
        shell: bash
        run: |
          set -euo pipefail
          java -jar build-secreto/apktool.jar b build-secreto/decoded \
            -o build-secreto/base-unsigned.apk
      - name: Add complete Zen DEX without modifying Secreto feature methods
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_altaplay_secreto_mod.py inject \
            build-secreto/base-unsigned.apk \
            tvhome/build/outputs/apk/tvbridge/debug/tvhome-tvbridge-debug.apk \
            build-secreto/altaplay-unsigned.apk
      - name: Align and sign LOCAL TEST with temporary key
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 \
            build-secreto/altaplay-unsigned.apk build-secreto/altaplay-aligned.apk
          keytool -genkeypair -keystore build-secreto/altaplay-test.jks \
            -storepass android -keypass android -alias altaplaytest \
            -dname "CN=AltaPlay Launcher Test, O=Local QA, C=MA" \
            -keyalg RSA -keysize 3072 -validity 3650 -noprompt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks build-secreto/altaplay-test.jks \
            --ks-pass pass:android --key-pass pass:android \
            --ks-key-alias altaplaytest \
            --out build-secreto/AltaPlay-Launcher-Secreto-v1.3.2-Zen-TEST.apk \
            build-secreto/altaplay-aligned.apk
      - name: Validate original Secreto components and Zen module
        shell: bash
        run: |
          set -euo pipefail
          APK="build-secreto/AltaPlay-Launcher-Secreto-v1.3.2-Zen-TEST.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.altaplay.launcher'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml > build-secreto/manifest-check.txt
          for component in "com.gathin.tvhome.MainActivity" \
             "com.gathin.tvhome.SecretoHomeService" \
             "com.gathin.tvhome.AdhanAlarmReceiver" \
             "com.gathin.tvhome.AdhanPlaybackService" \
             "com.satnova.alpha.Zen4HdmiRemoteService"; do
            grep -Fq "$component" build-secreto/manifest-check.txt
          done
          python3 - <<'PY'
          import zipfile
          p="build-secreto/AltaPlay-Launcher-Secreto-v1.3.2-Zen-TEST.apk"
          with zipfile.ZipFile(p) as z:
              assert z.getinfo("classes.dex").file_size > 200_000
              assert z.getinfo("classes2.dex").file_size > 200_000
              assert z.getinfo("assets/satnova_wallpaper.webp").file_size > 1000
              assert z.getinfo("assets/badr26-picons.tsv").file_size > 1000
              print("Original Secreto DEX plus Zen module, wallpaper and logos index present")
          PY
          sha256sum "$APK"
      - name: Upload PRIVATE TEST artifact (never publish official Secreto binary)
        uses: actions/upload-artifact@v4
        with:
          name: AltaPlay-Launcher-Secreto-v1.3.2-Zen-PRIVATE-TEST
          path: build-secreto/AltaPlay-Launcher-Secreto-v1.3.2-Zen-TEST.apk
          if-no-files-found: error
          retention-days: 3
