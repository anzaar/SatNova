name: AltaPlay Launcher Secreto v1.3.2 Direct Mod PRIVATE TEST
on:
  push:
    branches: [feature/altaplay-secreto-direct-mod-v132-20261119]
    paths:
      - scripts/build_altaplay_secreto_mod.py
      - scripts/altaplay-google-tv-emulator.sh
      - scripts/altaplay-wallpaper-ui.py
      - .github/workflows/build-altaplay-secreto-direct-mod.yml
      - tvhome/src/main/java/com/satnova/alpha/Zen4HdmiRemoteService.kt
      - tvhome/src/main/java/com/satnova/alpha/SecretoZenPanel.kt
      - tvhome/src/main/java/com/satnova/alpha/AltaPlayZenActivity.kt
      - tvhome/src/main/java/com/satnova/alpha/Zen4PersistentService.kt
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="$ANDROID_HOME"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDK_MANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile Zen bridge for standalone DEX injection
        run: gradle --no-daemon --stacktrace :tvhome:assembleTvbridgeDebug
      - name: Download verified official Secreto APK and pinned Apktool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-secreto
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/mohamedlalah/SecretoTVLauncher/releases/download/v1.3.2/SecretoTVLauncher-v1.3.2-vc10.apk" \
            -o build-secreto/secreto-official-v132.apk
          echo "ddadbda59ca902ec2895b228d4b680197418114be088db7b0ba56abb83e3a73c  build-secreto/secreto-official-v132.apk" | sha256sum -c -
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/iBotPeaches/Apktool/releases/download/v2.12.1/apktool_2.12.1.jar" \
            -o build-secreto/apktool.jar
          echo "66cf4524a4a45a7f56567d08b2c9b6ec237bcdd78cee69fd4a59c8a0243aeafa  build-secreto/apktool.jar" | sha256sum -c -
      - name: Decode full Secreto UI and resources
        shell: bash
        run: |
          set -euo pipefail
          java -jar build-secreto/apktool.jar d -f \
            build-secreto/secreto-official-v132.apk -o build-secreto/decoded
          test -s build-secreto/decoded/AndroidManifest.xml
          test -d build-secreto/decoded/smali
      - name: Change only app identity, add Zen service and Islamic wallpaper
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_altaplay_secreto_mod.py patch build-secreto/decoded .
          grep -Fq 'com.altaplay.launcher' build-secreto/decoded/AndroidManifest.xml
          grep -Fq 'com.satnova.alpha.Zen4HdmiRemoteService' build-secreto/decoded/AndroidManifest.xml
      - name: Rebuild Secreto with original smali and preserved feature resources
        shell: bash
        run: |
          set -euo pipefail
          java -jar build-secreto/apktool.jar b build-secreto/decoded \
            -o build-secreto/base-unsigned.apk
      - name: Add complete Zen DEX without modifying Secreto feature methods
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_altaplay_secreto_mod.py inject \
            build-secreto/base-unsigned.apk \
            tvhome/build/outputs/apk/tvbridge/debug/tvhome-tvbridge-debug.apk \
            build-secreto/altaplay-unsigned.apk
      - name: Align and sign LOCAL TEST with temporary key
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 \
            build-secreto/altaplay-unsigned.apk build-secreto/altaplay-aligned.apk
          keytool -genkeypair -keystore build-secreto/altaplay-test.jks \
            -storepass android -keypass android -alias altaplaytest \
            -dname "CN=AltaPlay Launcher Test, O=Local QA, C=MA" \
            -keyalg RSA -keysize 3072 -validity 3650 -noprompt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks build-secreto/altaplay-test.jks \
            --ks-pass pass:android --key-pass pass:android \
            --ks-key-alias altaplaytest \
            --out build-secreto/AltaPlay-Launcher-Secreto-v1.3.2-Zen-TEST.apk \
            build-secreto/altaplay-aligned.apk
      - name: Validate original Secreto components and Zen module
        shell: bash
        run: |
          set -euo pipefail
          APK="build-secreto/AltaPlay-Launcher-Secreto-v1.3.2-Zen-TEST.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.altaplay.launcher'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml > build-secreto/manifest-check.txt
          for component in "com.gathin.tvhome.MainActivity" \
             "com.gathin.tvhome.SecretoHomeService" \
             "com.gathin.tvhome.AdhanAlarmReceiver" \
             "com.gathin.tvhome.AdhanPlaybackService" \
             "com.satnova.alpha.Zen4HdmiRemoteService"; do
            grep -Fq "$component" build-secreto/manifest-check.txt
          done
          python3 - <<'PY'
          import zipfile
          p="build-secreto/AltaPlay-Launcher-Secreto-v1.3.2-Zen-TEST.apk"
          with zipfile.ZipFile(p) as z:
              assert z.getinfo("classes.dex").file_size > 200_000
              assert z.getinfo("classes2.dex").file_size > 200_000
              assert z.getinfo("assets/satnova_wallpaper.webp").file_size > 1000
              assert z.getinfo("assets/badr26-picons.tsv").file_size > 1000
              print("Original Secreto DEX plus Zen module, wallpaper and logos index present")
          PY
          sha256sum "$APK"
      - name: Make room for the actual Google TV Android 14 AVD
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/cmake /usr/local/share/powershell || true
          sudo apt-get clean
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          df -h /
      - name: Lint ADB UI test harness
        run: bash -n scripts/altaplay-google-tv-emulator.sh
      - name: Lint native wallpaper settings navigation
        run: python3 -m py_compile scripts/altaplay-wallpaper-ui.py
      - name: Run real Google TV 14 emulator and capture actual screenshots
        id: google_tv_emulator
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google-tv
          arch: x86
          profile: tv_1080p
          cores: 2
          ram-size: 2048M
          disk-size: 1024M
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -partition-size 1536 -gpu swiftshader_indirect
          script: bash scripts/altaplay-google-tv-emulator.sh && python3 scripts/altaplay-wallpaper-ui.py
      - name: Save true Google TV screenshots to the QA branch
        if: always()
        shell: bash
        env:
          TEST_CONCLUSION: ${{ steps.google_tv_emulator.outcome }}
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check Pillow
          export DEST="docs/qa/altaplay-google-tv/runs/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 - <<'PY'
          import os,shutil
          from pathlib import Path
          from PIL import Image
          dst=Path(os.environ["DEST"])
          dst.mkdir(parents=True,exist_ok=True)
          out=dst/"screens"
          out.mkdir(exist_ok=True)
          root=Path("altaplay-emulator-evidence")
          count=0
          if (root/"screens").exists():
              for f in sorted((root/"screens").glob("*.png")):
                  try:
                      im=Image.open(f).convert("RGB")
                      im.thumbnail((1280,720),Image.Resampling.LANCZOS)
                      im.save(out/(f.stem+".webp"),"WEBP",quality=85,method=5)
                      count+=1
                  except Exception as ex: print("Capture rejected:",f,ex)
          for f in sorted(root.glob("*.txt"))+sorted(root.glob("*.log")):
              shutil.copy2(f,dst/f.name)
          (dst/"README.md").write_text(
              "# AltaPlay Launcher — actual Google TV 14 emulator evidence\n\n"+
              "Experiment on Google TV AVD, NOT Lifemaxx. Screenshots are real emulator captures.\n"+
              "Secreto original HOME + Zen 4 supplementary DEX. No Zen receiver or physical HDMI exists in AVD.\n"+
              "Captured images: "+str(count)+"\n"+
              "Emulator step: "+os.environ.get("TEST_CONCLUSION","unknown")+"\n")
          print("Captured and versioned",count,"real Google TV screenshots")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$DEST"
          if git diff --cached --quiet; then
            echo "::warning::No emulator screenshots or logs to commit"
            exit 0
          fi
          git commit -m "Store genuine AltaPlay/Secreto Google TV QA captures for run $GITHUB_RUN_ID [skip ci]"
          for n in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            if git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"; then
              echo "QA images saved at $DEST"
              exit 0
            fi
          done
          echo "::error::Unable to save emulator evidence"
          exit 1
      - name: Upload to owner-only DRAFT Release (artifact storage quota exhausted)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Draft release is visible only to users with repository write access.
          # DO NOT PUBLISH this third-party modified APK to the general public.
          TAG="altaplay-secreto-zen-private-$(git rev-parse --short=12 HEAD)"
          APK="build-secreto/AltaPlay-Launcher-Secreto-v1.3.2-Zen-TEST.apk"
          test -s "$APK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Draft tag already exists: refusing to overwrite"
            exit 1
          fi
          gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --draft \
            --title "PRIVATE TEST: AltaPlay Launcher on Secreto v1.3.2 with Zen 4" \
            --notes "OWNER-ONLY DRAFT. Do not publish this derivative without confirming rights. Original Secreto v1.3.2 APK from verified official SHA256, original HOME, Adhan, weather, wallpaper, app management preserved in code. Dedicated package com.altaplay.launcher, Zen 4 overlay and HDMI Accessibility service added. Ephemeral test signing only; NOT hardware-verified on Lifemaxx. Install alongside original Secreto, keep the original HOME as recovery."
          echo "Owner-only draft release complete."
