name: Build AltaPlay Launcher APK

on:
  push:
    branches:
      - feature/altaplay-launcher-cleanyourtv-build
    paths:
      - 'altaplay-launcher/**'
      - '.github/workflows/altaplay-launcher-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout build payload
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 34 platform
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Download CleanYourTV upstream source
        run: git clone --depth 1 https://github.com/Gathin23/cleanyourtv.git upstream
      - name: Apply AltaPlay source overlay
        run: |
          python3 - <<'PY'
          import base64,pathlib,zipfile
          source=pathlib.Path("altaplay-launcher/overlay-v0.1.zip.base64.txt").read_text()
          payload=base64.b64decode("".join(source.split()))
          archive=pathlib.Path("overlay.zip")
          archive.write_bytes(payload)
          with zipfile.ZipFile(archive) as z:
              z.extractall(".")
          PY
          python3 AltaPlay-CleanYourTV-overlay/apply_overlay.py upstream
      - name: Test G-MScreen protocol
        run: bash AltaPlay-CleanYourTV-overlay/tests/run_protocol_tests.sh
      - name: Build debug APK
        working-directory: upstream/launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Stage APK
        run: |
          mkdir -p dist
          cp upstream/launcher/app/build/outputs/apk/debug/app-debug.apk dist/AltaPlay-Launcher-v0.2-debug.apk
          sha256sum dist/*.apk
      - name: Publish private GitHub prerelease APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="altaplay-launcher-v0.2.0-preview"
          ASSET="dist/AltaPlay-Launcher-v0.2-debug.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --target "$GITHUB_SHA" \
              --title "AltaPlay Launcher v0.2 Preview" \
              --notes "Android TV preview built from CleanYourTV with SatNova ZEN 4 controls. Test as app first; do not disable the stock launcher. Automatic HDMI remote forwarding and official adhan need real hardware verification." \
              --prerelease
          fi
