name: AltaPlay v0.12 Full Screenshot Gallery
on:
  push:
    branches:
      - feature/altaplay-v012-multilingual-safe-ui-20261122
    paths:
      - '.github/workflows/altaplay-v012-gallery.yml'
      - '.github/qa/v012_capture_screens.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screenshot-gallery:
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
      - name: Download exact tested AltaPlay v0.12 release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p qa-results
          gh release download altaplay-launcher-v0.12.0-preview --repo "${GITHUB_REPOSITORY}" --pattern 'AltaPlay-Launcher-v0.12-debug.apk' --dir qa-results
          test -s qa-results/AltaPlay-Launcher-v0.12-debug.apk
          sha256sum qa-results/*.apk
      - name: Prepare Google TV emulator
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/cmake /usr/local/share/powershell || true
          sudo apt-get clean
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Capture actual screenshot gallery on Google TV 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google-tv
          arch: x86
          profile: tv_1080p
          cores: 2
          disk-size: 1536M
          ram-size: 2048M
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -partition-size 1536 -gpu swiftshader_indirect
          script: python3 .github/qa/v012_capture_screens.py
      - name: Validate evidence and fail closed
        if: always()
        run: |
          set -euo pipefail
          path=qa-results/v012-gallery
          test -s "$path/qa-capture-report.txt"
          cat "$path/qa-capture-report.txt"
          count=$(find "$path" -maxdepth 1 -type f -name '*.png' | wc -l)
          echo "Real Google TV emulator screenshots: $count"
          test "$count" -ge 12
          grep -Eq '^TV version: 14([.]0)?$' "$path/qa-capture-report.txt"
          grep -q '^Emulator model: ' "$path/qa-capture-report.txt"
          grep -q 'INSTALL: Success' "$path/qa-capture-report.txt"
          grep -q '^FIRST-RUN FINAL STATE: wizard not detected$' "$path/qa-capture-report.txt"
          ! grep -q 'SCREENSHOT FAILED' "$path/qa-capture-report.txt"
          ! grep -q 'COMMAND EXCEPTION' "$path/qa-capture-report.txt"
          ! grep -q '^COMMAND ERR' "$path/qa-capture-report.txt"
          ! grep -q -Ei "zen_mock_receiver|ZEN MOCK PREF|receiver ready on 20000" "$path/qa-capture-report.txt"
          echo "Evidence gate passed. Receiver, Zen protocol, network discovery and HDMI were intentionally excluded."
      - name: Preserve diagnostic screenshots and QA report even when validation fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: altaplay-v012-qa-diagnostics
          path: qa-results/v012-gallery/
          if-no-files-found: warn
          retention-days: 14
      - name: Publish gallery to AltaPlay private GitHub release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(find qa-results/v012-gallery -maxdepth 1 -type f -name '*.png' | wc -l)" -ge 12
          (cd qa-results && zip -q -r ../AltaPlay-v0.12-Full-GoogleTV-Screenshots.zip v012-gallery)
          gh release upload altaplay-launcher-v0.12.0-preview AltaPlay-v0.12-Full-GoogleTV-Screenshots.zip --clobber --repo "${GITHUB_REPOSITORY}"
