name: SatNova TV HOME reboot fix - Direct Test APK
on:
  push:
    branches: [feature/tvbridge-home-override-optin-20261119]
    paths:
      - .github/workflows/publish-tv-home-bootfix-test.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-tvbridge-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          MANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$MANAGER"
          yes | "$MANAGER" --licenses >/dev/null || true
          "$MANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile latest tested TV-bridge debug APK
        run: gradle --no-daemon --stacktrace :tvhome:assembleTvbridgeDebug
      - name: Validate yellow EXIT mapping in source before packaging
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'KeyEvent.KEYCODE_PROG_YELLOW -> 7' tvhome/src/main/java/com/satnova/alpha/Zen4HdmiRemoteService.kt
          ! grep -Fq 'KeyEvent.KEYCODE_BACK -> 7' tvhome/src/main/java/com/satnova/alpha/Zen4HdmiRemoteService.kt
          grep -Fq 'KeyEvent.KEYCODE_BACK,' tvhome/src/main/java/com/satnova/alpha/Zen4HdmiRemoteService.kt
      - name: Verify APK and identify installed package and certificate
        shell: bash
        run: |
          set -euo pipefail
          APK="tvhome/build/outputs/apk/tvbridge/debug/tvhome-tvbridge-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 10
          sha256sum "$APK" | tee apk-checksum.txt
          grep -q 'Signer #1 certificate SHA-256 digest:' apk-signature.txt
      - name: Publish direct APK release for Lifemaxx TV manual testing
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="v0.5.14-tvbridge-yellow-exit-native-back-20261119-test"
          APK_NAME="SatNova-TV-Home-HDMI-Bridge-0.5.14-YELLOW-EXIT-NATIVE-BACK-TEST.apk"
          cp tvhome/build/outputs/apk/tvbridge/debug/tvhome-tvbridge-debug.apk "$APK_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Test release tag already exists; refusing to overwrite other APK signatures"
            exit 1
          fi
          gh release create "$TAG" "$APK_NAME"             --target "$GITHUB_SHA"             --prerelease             --title "SatNova TV Home - Yellow EXIT / Native TV BACK - Test"             --notes "EXPERIMENTAL Android TV APK fixing HDMI remote rearm after HOME/Shahid/SOURCE and mapping Lifemaxx yellow KEYCODE_PROG_YELLOW (185) to Zen 4 EXIT KeyValue 7 while leaving TV BACK KEYCODE_BACK (4) completely untouched, only within an authorized HDMI session (2-hour maximum). Google TV Android 14 previously passed first HOME press after reboot, but the updated HDMI re-arm must still be tested on real Lifemaxx 55 and Zen 4. This is a DEBUG-SIGNED TEST APK; existing APK installations may use a different certificate. If Android reports an incompatible update, DO NOT uninstall until settings and personal data are backed up. Keep factory Google TV HOME installed/enabled. The optional Accessibility HOME override requires explicit user consent. The APK is separate from the SatNova phone app."
          echo "DIRECT_APK_URL=https://github.com/${GH_REPO}/releases/download/${TAG}/${APK_NAME}"
          echo "BUILT_SHA=$GITHUB_SHA"
