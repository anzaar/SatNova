name: SatNova TV HOME reboot fix - Direct Test APK
on:
  push:
    branches: [feature/tvbridge-home-override-optin-20261119]
    paths:
      - .github/workflows/publish-tv-home-bootfix-test.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-tvbridge-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          MANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$MANAGER"
          yes | "$MANAGER" --licenses >/dev/null || true
          "$MANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile latest tested TV-bridge debug APK
        run: gradle --no-daemon --stacktrace :tvhome:assembleTvbridgeDebug
      - name: Validate yellow EXIT mapping in source before packaging
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'KeyEvent.KEYCODE_PROG_YELLOW -> 7' tvhome/src/main/java/com/satnova/alpha/Zen4HdmiRemoteService.kt
          ! grep -Fq 'KeyEvent.KEYCODE_BACK -> 7' tvhome/src/main/java/com/satnova/alpha/Zen4HdmiRemoteService.kt
          grep -Fq 'KeyEvent.KEYCODE_BACK,' tvhome/src/main/java/com/satnova/alpha/Zen4HdmiRemoteService.kt
      - name: Assert surah-by-surah Quran UI and streaming
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'pagedHorizontal(QuranLibrary.surahs()' tvhome/src/main/java/com/satnova/alpha/MinimalHomeActivity.kt
          grep -Fq 'startStreamingAudio(audioUrl, token)' tvhome/src/main/java/com/satnova/alpha/QuranLibrary.kt
          grep -Fq 'downloads.execute' tvhome/src/main/java/com/satnova/alpha/QuranLibrary.kt
          grep -Fq 'KeyEvent.KEYCODE_PROG_YELLOW -> 7' tvhome/src/main/java/com/satnova/alpha/Zen4HdmiRemoteService.kt
      - name: Validate user-opt-in boot fallback and safe boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'RECEIVE_BOOT_COMPLETED' tvhome/src/tvbridge/AndroidManifest.xml
          grep -Fq 'SatNovaBootReceiver' tvhome/src/tvbridge/AndroidManifest.xml
          grep -Fq 'boot_home_enabled' tvhome/src/main/java/com/satnova/alpha/SatNovaBootReceiver.kt
          grep -Fq 'boot_home_pending_until_elapsed' tvhome/src/main/java/com/satnova/alpha/Zen4HdmiRemoteService.kt
          grep -Fq 'configureBootHome()' tvhome/src/main/java/com/satnova/alpha/MinimalHomeActivity.kt
      - name: Validate receiver-first setup and HDMI fail-closed bridge
        run: |
          set -euo pipefail
          grep -Fq 'private fun startSetupWizard()' tvhome/src/main/java/com/satnova/alpha/MinimalHomeActivity.kt
          grep -Fq 'client.connected && client.verifiedHost != null' tvhome/src/main/java/com/satnova/alpha/MinimalHomeActivity.kt
          grep -Fq 'satnova_selected_hdmi_input_id' tvhome/src/main/java/com/satnova/alpha/Zen4HdmiRemoteService.kt
          grep -Fq 'authorizedHdmiForeground(viewer)' tvhome/src/main/java/com/satnova/alpha/Zen4HdmiRemoteService.kt
      - name: Verify APK and identify installed package and certificate
        shell: bash
        run: |
          set -euo pipefail
          APK="tvhome/build/outputs/apk/tvbridge/debug/tvhome-tvbridge-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 10
          sha256sum "$APK" | tee apk-checksum.txt
          grep -q 'Signer #1 certificate SHA-256 digest:' apk-signature.txt
      - name: Publish direct APK release for Lifemaxx TV manual testing
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="v0.5.14-tvbridge-automatic-setup-hdmi-20261119-test"
          APK_NAME="SatNova-TV-Home-HDMI-Bridge-0.5.14-AUTO-SETUP-HDMI-TEST.apk"
          cp tvhome/build/outputs/apk/tvbridge/debug/tvhome-tvbridge-debug.apk "$APK_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Test release tag already exists; refusing to overwrite other APK signatures"
            exit 1
          fi
          gh release create "$TAG" "$APK_NAME"             --target "$GITHUB_SHA"             --prerelease             --title "SatNova TV Home - Receiver-First Auto Setup & HDMI Guard - Test"             --notes "EXPERIMENTAL Android TV APK: first-run guided setup begins with automatic authenticated Zen 4 discovery, skips connected/approved states, asks only for Android HOME/Accessibility permissions, enables optional HDMI auto control after permission, and forwards keys only after SatNova requested a physically connected HDMI passthrough and a verified viewer is foreground. No arbitrary Android app interception. TV firmware active-picture validation remains necessary. Preserves one-shot boot, Quran stream, yellow EXIT and TV BACK. Google TV Android 14 previously passed first HOME press after reboot, but the updated HDMI re-arm must still be tested on real Lifemaxx 55 and Zen 4. This is a DEBUG-SIGNED TEST APK; existing APK installations may use a different certificate. If Android reports an incompatible update, DO NOT uninstall until settings and personal data are backed up. Keep factory Google TV HOME installed/enabled. The optional Accessibility HOME override requires explicit user consent. The APK is separate from the SatNova phone app."
          echo "DIRECT_APK_URL=https://github.com/${GH_REPO}/releases/download/${TAG}/${APK_NAME}"
          echo "BUILT_SHA=$GITHUB_SHA"
