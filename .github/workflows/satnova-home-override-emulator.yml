name: SatNova Opt-in Google TV Home Override - Android 14 Emulator
on:
  push:
    branches: [feature/tvbridge-home-override-optin-20261119]
    paths: [.github/workflows/satnova-home-override-emulator.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  optional-home-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Free unused runner data for Google TV AVD
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/cmake /usr/local/share/powershell || true
          sudo apt-get clean
          df -h /
      - name: Enable KVM for Android emulator
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          MANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          yes | "$MANAGER" --licenses >/dev/null || true
          "$MANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Lint test harness before emulator
        shell: bash
        run: bash -n scripts/satnova-home-override-emulator.sh
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile candidate debug APK
        run: gradle --no-daemon --stacktrace :tvhome:assembleTvbridgeDebug
      - name: Test user-opt-in launcher fallback in real Google TV 14 AVD
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google-tv
          arch: x86
          profile: tv_1080p
          cores: 2
          ram-size: 2048M
          disk-size: 1024M
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -partition-size 1536 -gpu swiftshader_indirect
          script: bash scripts/satnova-home-override-emulator.sh
      - name: Preserve screenshots, focus state and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SatNova-GoogleTV14-Accessibility-HOME-Evidence
          path: home-override-evidence/
          if-no-files-found: warn
          retention-days: 10
