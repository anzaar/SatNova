name: SatNova Opt-in Google TV Home Override - Android 14 Emulator
on:
  push:
    branches: [feature/tvbridge-home-override-optin-20261119]
    paths:
      - .github/workflows/satnova-home-override-emulator.yml
      - scripts/satnova-home-override-emulator.sh
      - scripts/satnova-ui-tour.py
      - scripts/satnova-screenshot-contact-sheet.py
      - tvhome/src/main/java/com/satnova/alpha/AtlasLionsEmblemView.kt
      - tvhome/src/main/java/com/satnova/alpha/MoroccanHomePanel.kt
      - tvhome/src/main/java/com/satnova/alpha/Zen4HdmiRemoteService.kt
      - tvhome/src/main/java/com/satnova/alpha/MinimalHomeActivity.kt
  workflow_dispatch:
concurrency:
  group: satnova-google-tv-qa-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  optional-home-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Free unused runner data for Google TV AVD
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/cmake /usr/local/share/powershell || true
          sudo apt-get clean
          df -h /
      - name: Enable KVM for Android emulator
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          MANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          yes | "$MANAGER" --licenses >/dev/null || true
          "$MANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Lint test harness before emulator
        shell: bash
        run: |
          bash -n scripts/satnova-home-override-emulator.sh
          python3 -m py_compile scripts/satnova-ui-tour.py scripts/satnova-screenshot-contact-sheet.py
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile candidate debug APK
        run: gradle --no-daemon --stacktrace :tvhome:assembleTvbridgeDebug
      - name: Test user-opt-in launcher fallback in real Google TV 14 AVD
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google-tv
          arch: x86
          profile: tv_1080p
          cores: 2
          ram-size: 2048M
          disk-size: 1024M
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -partition-size 1536 -gpu swiftshader_indirect
          script: bash scripts/satnova-home-override-emulator.sh
      - name: Compose screenshot review sheet from actual emulator captures
        if: always()
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check Pillow
          python3 scripts/satnova-screenshot-contact-sheet.py
      - name: Preserve emulator screenshots in unique run directory (no shared-image conflicts)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # Each run writes only to its own immutable subfolder.
          export DEST="docs/qa/google-tv-v014/runs/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$DEST/screens"
          python3 - <<'PY'
          import os, json, shutil
          from pathlib import Path
          from PIL import Image
          dest=Path(os.environ["DEST"])
          src=Path("home-override-evidence/screens")
          copied=0
          if src.is_dir():
              for path in sorted(src.glob("*.png")):
                  im=Image.open(path).convert("RGB")
                  im.thumbnail((1280,720), Image.Resampling.LANCZOS)
                  im.save(dest/"screens"/(path.stem+".webp"), "WEBP", quality=76, method=5)
                  copied+=1
          for name,source in (
              ("screens-index.json",src/"index.json"),
              ("ui-tour.log",Path("home-override-evidence/ui-tour.log")),
          ):
              if source.is_file():
                  shutil.copy2(source,dest/name)
          testlog=Path("home-override-evidence/test.log")
          if testlog.is_file():
              lines=testlog.read_text(errors="replace").splitlines()
              relevant=[line for line in lines if any(term in line for term in
                  ("RESULT:", "HOME holder", "Android API:", "Google TV",
                   "Enabled services", "reboot", "ACCESSIBILITY"))]
              (dest/"test-result.txt").write_text("\n".join(relevant)+"\n")
          sheet=Path("home-override-evidence/SatNova_v1_Real_Screenshot_Contact_Sheet.jpg")
          if sheet.is_file():
              shutil.copy2(sheet,dest/"contact-sheet.jpg")
          (dest/"README.md").write_text(
              "# SatNova Google TV 14 emulator — run "+os.environ["GITHUB_RUN_ID"]+
              "\n\nActual emulator screenshots, not mockups. "
              "HOME and reboot results are recorded separately in test-result.txt.\n"
              "This does NOT prove HDMI/Zen4 or Lifemaxx compatibility.\n\n"
              "Screenshots captured: "+str(copied)+"\n")
          print("Saved real emulator screenshots:",copied,"in",dest)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$DEST"
          if git diff --cached --quiet; then
            echo "No new screenshot evidence"
            exit 0
          fi
          git commit -m "Save Google TV QA images in unique run ${GITHUB_RUN_ID} [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            if git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"; then
              echo "QA images published to $DEST"
              exit 0
            fi
            echo "Remote changed during upload; retry $attempt"
            sleep 2
          done
          echo "Failed to publish unique QA folder after retries" >&2
          exit 1
