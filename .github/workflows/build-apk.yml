name: Build SatNova V2.3 Lifemaxx TLS Fix APK
on:
  workflow_dispatch:
  push:
    branches: [main, external-download-v2.3]
concurrency:
  group: satnova-v2-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare installed Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDK_MANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDK_MANAGER"
          echo "Using SDK manager: $SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build test APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SatNova-V2-Beta-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14



      - name: Upload APK to independent external file host
        if: github.ref == 'refs/heads/external-download-v2.3'
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK"
          URL=""
          echo "Trying Uguu API (max 128 MB, valid 3 hours)..."
          RESPONSE="$(curl --silent --show-error --fail --max-time 180 --retry 1 \
            -F "files[]=@$APK;filename=SatNova-V2.3-Lifemaxx.apk" \
            'https://uguu.se/upload')" || RESPONSE=""
          if [[ -n "$RESPONSE" ]]; then
            URL="$(printf '%s' "$RESPONSE" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d["files"][0]["url"] if d.get("success") else "")' 2>/dev/null)" || URL=""
          fi
          if [[ ! "$URL" =~ ^https:// ]]; then
            echo "Uguu unavailable; trying BashUpload Cloudflare R2..."
            RESPONSE="$(curl --silent --show-error --fail --max-time 180 \
              -H 'X-Expiration-Seconds: 86400' \
              --upload-file "$APK" 'https://bashupload.app/SatNova-V2.3-Lifemaxx.apk')" || RESPONSE=""
            URL="$(printf '%s' "$RESPONSE" | grep -oE 'https://[^[:space:]]+\.apk' | head -n 1 || true)"
          fi
          if [[ ! "$URL" =~ ^https:// ]]; then
            echo "BashUpload unavailable; trying Qurl..."
            RESPONSE="$(curl --silent --show-error --fail --max-time 180 \
              -H 'X-TTL: 24h' -H 'X-Downloads: 100' \
              --upload-file "$APK" 'https://qurl.sh/SatNova-V2.3-Lifemaxx.apk')" || RESPONSE=""
            URL="$(printf '%s' "$RESPONSE" | grep -oE 'https://qurl[.]sh/[^[:space:]]+\.apk' | head -n 1 || true)"
          fi
          if [[ "$URL" =~ ^https://[^[:space:]]+[.]apk$ ]]; then
            echo "EXTERNAL_APK_URL=$URL"
            echo "EXTERNAL_APK_URL=$URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::No external file host accepted APK; cannot advertise an unverified link."
            exit 1
          fi

      - name: Publish direct APK via GitHub Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          LATEST_SHA="$(gh api "repos/${GH_REPO}/commits/main" --jq '.sha')"
          if [ "$LATEST_SHA" != "$GITHUB_SHA" ]; then
            echo "Skipping outdated APK publication: $GITHUB_SHA (latest $LATEST_SHA)"
            exit 0
          fi
          cp app/build/outputs/apk/debug/app-debug.apk SatNova-V2.3-Lifemaxx.apk
          if ! gh release view v2.3-lifemaxx >/dev/null 2>&1; then
            gh release create v2.3-lifemaxx \
              --title "SatNova V2.3 — Correctif TLS Lifemaxx" \
              --notes "V2.3 beta: Android TV Remote pairing TLS RSA/PSS compatibility fix for Lifemaxx Android TV 14. Keeps V2.2 groups, signal, receiver commands. Hardware validation required." \
              --prerelease --target "${GITHUB_SHA}"
          fi
          gh release upload v2.3-lifemaxx SatNova-V2.3-Lifemaxx.apk --clobber
          echo "Direct APK URL: https://github.com/${GH_REPO}/releases/download/v2.3-lifemaxx/SatNova-V2.3-Lifemaxx.apk"


