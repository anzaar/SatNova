name: Build SatNova V2 APK (Beta)
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: satnova-v2-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare installed Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDK_MANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDK_MANAGER"
          echo "Using SDK manager: $SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build test APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SatNova-V2-Beta-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct APK via GitHub Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          LATEST_SHA="$(gh api "repos/${GH_REPO}/commits/main" --jq '.sha')"
          if [ "$LATEST_SHA" != "$GITHUB_SHA" ]; then
            echo "Skipping outdated APK publication: $GITHUB_SHA (latest $LATEST_SHA)"
            exit 0
          fi
          cp app/build/outputs/apk/debug/app-debug.apk SatNova-V2-Beta.apk
          if ! gh release view v2-beta >/dev/null 2>&1; then
            gh release create v2-beta \
              --title "SatNova V2 Beta — Télécommande Android TV" \
              --notes "V2 beta: independent Android TV Wi-Fi remote with on-screen pairing. Receiver features retained from 1.25. TV pairing requires real-device validation." \
              --prerelease --target "${GITHUB_SHA}"
          fi
          gh release upload v2-beta SatNova-Latest.apk --clobber
          echo "Direct APK URL: https://github.com/${GH_REPO}/releases/download/v2-beta/SatNova-Latest.apk"


