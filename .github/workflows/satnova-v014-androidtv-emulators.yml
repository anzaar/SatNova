name: SatNova v0.5.14 Signed APK Virtual Android TV Regression
on:
  push:
    branches: [feature/satnova-v014-virtual-tests-20261119]
    paths: [.github/workflows/satnova-v014-androidtv-emulators.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-tv-virtual:
    name: Android TV SDK ${{ matrix.api }} 3x install HOME reboot
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        api: [32, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable hardware virtualization for official Android emulator
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "::warning::/dev/kvm not exposed on this GitHub runner"
          fi
      - name: Prepare Android build-tools for exact APK certificate verification
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDK_MANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" "build-tools;35.0.0" "platform-tools"
      - name: Run full signed-APK test inside Android TV emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: android-tv
          arch: x86
          profile: tv_1080p
          cores: 2
          ram-size: 2048M
          heap-size: 256M
          disk-size: 4096M
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: bash scripts/satnova-v014-androidtv-smoke.sh
      - name: Preserve evidence (logs, screenshots, timings)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: satnova-v014-emulator-api-${{ matrix.api }}-evidence
          path: |
            test-results/*.txt
            test-results/*.tsv
            test-results/*.xml
            test-results/*.png
            test-results/*.log
          if-no-files-found: warn
          retention-days: 7
