name: SatNova Optional HOME Override - Compile and Manifest Regression
on:
  push:
    branches: [feature/tvbridge-home-override-optin-20261119, feature/secreto-zen-offline-fast-reconnect-20261119, feature/altaplay-launcher-secreto-zen-20261119, feature/altaplay-secreto-preserved-zen-addon-20261119]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tvbridge-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDK_MANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile isolated debug candidate, never publish production APK
        run: gradle --no-daemon --stacktrace :tvhome:assembleTvbridgeDebug
      - name: Inspect merged manifest and APK
        shell: bash
        run: |
          set -euo pipefail
          APK=tvhome/build/outputs/apk/tvbridge/debug/tvhome-tvbridge-debug.apk
          test -s "$APK"
          unzip -t "$APK" > /dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "com.altaplay.launcher"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml > tvhome-merged-manifest.txt
          grep -Fq "Zen4HdmiRemoteService" tvhome-merged-manifest.txt
          grep -Fq "android.accessibilityservice.AccessibilityService" tvhome-merged-manifest.txt
          # QUERY visibility may mention HOME; only activity intent-filters must not.
          sed -n '/E: application/,$p' tvhome-merged-manifest.txt > tvhome-app-manifest.txt
          if grep -Fq "android.intent.category.HOME" tvhome-app-manifest.txt; then
            echo "::error::Zen addon must not declare Android HOME or replace Secreto"
            exit 1
          fi
          sha256sum "$APK"
      - name: Build verification summary
        shell: bash
        run: |
          echo "Debug candidate compiled, manifest checked and apksigner verified."
          echo "Artifact upload intentionally disabled while GitHub storage quota is full."
          echo "Production nova.apk remains unchanged."
      - name: Publish TEST add-on APK (Secreto is not modified)
        if: github.ref == 'refs/heads/feature/altaplay-secreto-preserved-zen-addon-20261119'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          APK="tvhome/build/outputs/apk/tvbridge/debug/tvhome-tvbridge-debug.apk"
          test -s "$APK"
          OUT="AltaPlay-Launcher-Secreto-Zen-Addon-0.1.0-TEST.apk"
          cp "$APK" "$OUT"
          TAG="v0.1.0-altaplay-secreto-zen-addon-${GITHUB_SHA:0:12}-test"
          gh release create "$TAG" "$OUT" --target "$GITHUB_SHA" --prerelease \
            --title "AltaPlay Launcher Zen Add-on — Experimental Secreto Overlay" \
            --notes "EXPERIMENTAL DEBUG-SIGNED APK; install alongside official Secreto. Does not replace HOME, edit Secreto, or disable Google launcher. Zen 4 channel/cache overlay is only visible on verified Secreto HOME, with optional GUIDE channel selection and existing HDMI accessibility key gating. First-run channel/logo cache requires a successful Zen connection. The Islamic wallpaper is available separately from the SatNova repo for manual import in Secreto Wallpaper Studio. NOT tested on Lifemaxx hardware; do not disable your original HOME. Debug signing may change between CI runs, requiring uninstall for future test APKs."
