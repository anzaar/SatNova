name: SatNova v0.5.14 Signed APK Virtual Google TV Regression
on:
  push:
    branches: [feature/satnova-v014-virtual-tests-20261119]
    paths: [.github/workflows/satnova-v014-google-tv-emulator.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  google-tv:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Free disk space for AVD userdata partition
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/cmake /usr/local/share/powershell || true
          sudo apt-get clean
          df -h /
      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; else echo "::warning::No KVM"; fi
      - name: Android SDK build-tools 35 and platform tools
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDK_MANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" "build-tools;35.0.0" "platform-tools"
      - name: Real signed APK smoke tests on Google TV API 34
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google-tv
          arch: x86
          profile: tv_1080p
          cores: 2
          ram-size: 2048M
          disk-size: 1024M
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -partition-size 1536 -gpu swiftshader_indirect
          script: bash scripts/satnova-v014-androidtv-smoke.sh
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: satnova-v014-google-tv-api34-evidence
          path: |
            test-results/*.txt
            test-results/*.tsv
            test-results/*.xml
            test-results/*.png
            test-results/*.log
          if-no-files-found: warn
          retention-days: 7
