name: AltaPlay Habous source diagnostics
on:
  push:
    branches: [feature/altaplay-launcher-cleanyourtv-build]
    paths: ['.github/workflows/altaplay-source-check.yml']
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect exact official responses and certified mirror page
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,re,ssl,html
          endpoints={
            "habous_official_unverified_diagnostic_only":"https://habous.gov.ma/prieres/horaire_hijri_2.php?ville=2",
            "habous_home_unverified_diagnostic_only":"https://habous.gov.ma/",
            "habous_month_unverified_diagnostic_only":"https://habous.gov.ma/data/horaires-2026-11.js",
            "habous_www_month_verified":"https://www.habous.gov.ma/data/horaires-2026-11.js",
            "habous_www_home_verified":"https://www.habous.gov.ma/",
            "habous_december_unverified_diagnostic_only":"https://habous.gov.ma/data/horaires-2026-12.js",
            "habous_code_unverified_diagnostic_only":"https://habous.gov.ma/assets/js/prieres.js",
            "prayertimes_ma_khemisset":"https://prayertimes.ma/ar/mawaqit-salah-khemissat",
            "prayertimes_ma_cities":"https://prayertimes.ma/fr/villes",
            "ahfid_khemisset":"https://ahfid.me/ar/tools/prayer-times/khemisset/",
          }
          for name,url in endpoints.items():
            try:
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (compatible; AltaPlay QA/0.3)"})
              kwargs={"timeout":17}
              if "unverified_diagnostic_only" in name:kwargs["context"]=ssl._create_unverified_context()
              with urllib.request.urlopen(req,**kwargs) as response:
                body=response.read(900_000).decode("utf-8","replace")
                print("SOURCE",name,"STATUS",response.status,"bytes",len(body),"final_url",response.url)
                text=" ".join(html.unescape(re.sub(r"<[^>]+>"," ",body)).split())
                for token in ["حصة الصلاة","نوفمبر","نونبر","جمادى", "20 نونبر", "Khemisset", "khemisset","الصبح"]:
                  ix=text.find(token)
                  if ix>=0: print("  term",token,"context",repr(text[max(0,ix-60):ix+240]))
                links=re.findall(r'href=["\\\']([^"\\\']*(?:prayer|salat|khemisset)[^"\\\']*)',body,re.I)
                print("  links_sample",links[:9])
                if name.startswith("habous_month") or name.startswith("habous_code"):
                  print("  raw_official_script_start",body[:2800])
                if name=="habous_home_unverified_diagnostic_only":
                  print("  raw_home_html",body[:10000])
                print("  ministry_table",bool(re.search(r'<table[^>]*id=["\\\']?horaire',body,re.I)))
            except Exception as e:print("SOURCE",name,"ERROR",type(e).__name__,str(e)[:190])
          PY
