name: AltaPlay official monthly dataset certificate and digest diagnostics
on:
  push:
    branches: [feature/altaplay-launcher-cleanyourtv-build]
    paths: ['.github/workflows/altaplay-source-check.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify ministry monthly dataset and certificate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,urllib.error,ssl,hashlib,json,re
          u='https://habous.gov.ma/data/horaires-2026-11.js'
          for host in ['https://habous.gov.ma/data/horaires-2026-11.js',
                       'https://www.habous.gov.ma/data/horaires-2026-11.js']:
            for verified in (True,False):
              try:
                ctx=ssl.create_default_context() if verified else ssl._create_unverified_context()
                with urllib.request.urlopen(urllib.request.Request(host,headers={'User-Agent':'Mozilla/5.0'}),context=ctx,timeout=16) as response:
                  data=response.read(900000)
                  print('SOURCE',host,'SSL_VERIFIED',verified,'STATUS',response.status,'SHA256',hashlib.sha256(data).hexdigest(),'SIZE',len(data))
                  if not verified and host==u:
                    t=data.decode('utf-8')
                    v=json.loads(t[t.find('.push(')+6:t.rfind(')')])
                    city=next(x for x in v['villes'] if x['c']==2)
                    print('OFFICIAL_FORMAT',v['annee'],v['mois'],v['fuseau'],'CITY_COUNT',len(v['villes']),'KHEMISSET_NAME',city['n'],'DAY20',city['h'][19])
              except Exception as e:print('SOURCE_ERROR',host,'SSL_VERIFIED',verified,type(e).__name__,str(e)[:200])
          PY
